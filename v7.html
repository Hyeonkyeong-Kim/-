<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>적립금 관리</title>
<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f5f8;
    color:#222;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px 14px 40px;
}

h1{
    font-size:25px;
    margin:5px 0 20px;
    text-align:center;
}

h2{
    font-size:19px;
    margin:0 0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input,
textarea,
button{
    font-family:inherit;
}

input[type="date"],
input[type="number"],
textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    border:0;
    background:#f1f2f5;
    border-radius:12px;
    padding:13px;
    font-size:16px;
    outline:none;
}

input[type="date"]{
    width:100%;
    height:46px;
    min-height:46px;
    max-height:46px;
    padding:0 13px;
    line-height:46px;
    text-align:center;
    text-align-last:center;
    -webkit-appearance:none;
    appearance:none;
}

input[type="date"]::-webkit-date-and-time-value{
    height:46px;
    line-height:46px;
    text-align:center;
}

input[type="date"]::-webkit-datetime-edit{
    text-align:center;
}

input[type="date"]::-webkit-datetime-edit-fields-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    height:46px;
}

textarea{
    min-height:110px;
    resize:none;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.primary{
    width:100%;
    background:#5278ff;
    color:white;
    margin-top:10px;
}

.secondary{
    background:#eef0f5;
    color:#333;
}

.danger{
    background:#ffe9e9;
    color:#d33;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.summaryBox{
    background:#f5f6fa;
    border-radius:13px;
    padding:13px;
}

.summaryBox .title{
    font-size:12px;
    color:#777;
    margin-bottom:5px;
}

.summaryBox .value{
    font-size:18px;
    font-weight:700;
}

.blue{
    color:#5278ff;
}

.red{
    color:#e45757;
}

.green{
    color:#00a878;
}

.calendarTitle{
    font-size:18px;
    font-weight:700;
    margin:17px 0 10px;
}

.week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:4px;
}

.week div{
    text-align:center;
    font-size:12px;
    color:#888;
    padding:5px 0;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
}

.day{
    min-width:0;
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    position:relative;
}

.day.clickable{
    cursor:pointer;
}

.day.sunday{
    color:#e85b5b;
}

.day.saturday{
    color:#4d78df;
}

.day.selected{
    background:#5278ff;
    color:white !important;
    font-weight:700;
}

.day.start{
    background:#00ae83;
    color:white !important;
    font-weight:700;
}

.day.end{
    background:#ed6b6b;
    color:white !important;
    font-weight:700;
}

.day.outside{
    opacity:.25;
}

.day.futureSelected{
    background:#5278ff;
    color:white !important;
    font-weight:700;
}

.small{
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.result{
    border-radius:12px;
    background:#f6f7fa;
    padding:13px;
    margin-top:9px;
}

.result strong{
    display:block;
    margin-bottom:5px;
}

.lot{
    border:1px solid #e7e8ec;
    border-radius:12px;
    padding:12px;
    margin-top:8px;
    font-size:14px;
    line-height:1.7;
}

.statusAlive{
    color:#00a878;
    font-weight:700;
}

.statusExpired{
    color:#e45757;
    font-weight:700;
}

.statusFuture{
    color:#5278ff;
    font-weight:700;
}

.memoItem{
    background:#f6f7fa;
    border-radius:13px;
    padding:13px;
    margin-top:9px;
}

.memoDate{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

.memoText{
    white-space:pre-wrap;
    font-size:14px;
    line-height:1.6;
    padding-right:5px;
}

.memoDelete{
    margin-top:10px;
    padding:8px 11px;
    font-size:12px;
    background:#ffe9e9;
    color:#d33;
}

.memoEmpty{
    text-align:center;
    padding:18px 5px;
    color:#999;
    font-size:13px;
}

.noteSaved{
    color:#00a878;
    font-size:12px;
    margin-top:7px;
    min-height:17px;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:17px 0;
}

</style>
</head>
<body>
<div class="container">
<h1>적립금 관리</h1>
<div class="card">
<h2>① 적립 기간</h2>
적립 시작일
<input type=“date” id=“startDate”
<button class=“primary” onclick=“setStartDate()”
시작일 저장 
<div class="result">
종료일
-
</div>
</div>
<div class="card">
<h2>② 근무일 선택</h2>
<div class="small">
날짜를 눌러 근무일을 선택/해제하세요.<br>
미리 앞으로의 근무일을 선택해둘 수 있습니다.<br>
조회 기준일 이후의 근무일은 현재 적립금에는 포함되지 않습니다.
</div>
<div id="calendarArea"></div>
<hr>
<div class="summary">
<div class="summaryBox">
<div class="title">
전체 선택 근무일
</div>
<div
    class="value blue"
    id="workDays"
>
0일
</div>
</div>
<div class="summaryBox">
<div class="title">
조회일까지 근무일
</div>
<div
    class="value green"
    id="workedUntilCheck"
>
0일
</div>
</div>
<div class="summaryBox">
<div class="title">
조회일까지 적립
</div>
<div
    class="value blue"
    id="earnedMoney"
>
0원
</div>
</div>
<div class="summaryBox">
<div class="title">
예정 적립금
</div>
<div
    class="value red"
    id="futureMoney"
>
0원
</div>
</div>
</div>
</div>
<div class="card">
<h2>③ 잔여 포인트 조회</h2>
조회 기준일
<input type=“date” id=“checkDate” onchange=“updateSummary()”
<label>
현재 잔여 포인트
</label>
<input type=“number” id=“balance” inputmode=“numeric” placeholder=“예: 3000”
<button class=“primary” onclick=“calculateBalance()”
잔여 포인트 기준으로 조회 
<div id="balanceResult"></div>
</div>
<div class="card">
<h2>④ 메모</h2>
<textarea
    id="memo"
    placeholder="예: 8/3에 3,000원 남아있음&#10;8/4 포인트 사용 예정"
></textarea>
<button class=“primary” onclick=“saveMemo()”
메모 저장 
<div
    class="noteSaved"
    id="memoSaved"
></div>
<hr>
<div class="row">
<button class=“secondary” onclick=“clearMemos()”
메모 전체 삭제 
</div>
<div id="memoList"></div>
</div>
<div class="card">
<h2>⑤ 데이터 관리</h2>
<div class="row">
<button class=“secondary” onclick=“saveAll()”
전체 저장 
<button class=“danger” onclick=“resetAll()”
초기화 
</div>
<p class="small">
저장 기능을 지원하는 환경에서는 데이터를 기기에 저장합니다.
</p>
</div>
</div>
<script>

const POINT_PER_DAY = 4000;
const EXPIRY_DAYS = 31;

let startDate = null;
let endDate = null;
let selectedDays = new Set();
let memoList = [];


function dateKey(date){

    const y = date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(date.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function parseDate(str){

    if(!str) return null;

    const [
        y,
        m,
        d
    ] =
        str.split("-").map(Number);

    return new Date(y,m-1,d);
}


function addDays(date,days){

    const d = new Date(date);

    d.setDate(
        d.getDate()+days
    );

    return d;
}


function money(value){

    return Number(
        value || 0
    ).toLocaleString("ko-KR")+"원";
}



/* =========================
   시작일
========================= */

function setStartDate(){

    const value =
        document.getElementById(
            "startDate"
        ).value;

    if(!value){

        alert(
            "시작일을 선택해주세요."
        );

        return;
    }

    startDate = parseDate(value);

    endDate =
        addDays(
            startDate,
            EXPIRY_DAYS
        );

    selectedDays.clear();

    document.getElementById(
        "endDate"
    ).textContent =
        dateKey(endDate);

    document.getElementById(
        "balanceResult"
    ).innerHTML = "";

    drawCalendars();

    updateSummary();

    saveAll();
}



/* =========================
   달력
========================= */

function drawCalendars(){

    const area =
        document.getElementById(
            "calendarArea"
        );

    area.innerHTML="";

    if(!startDate){

        area.innerHTML =
        `
        <p class="small">
        먼저 적립 시작일을 선택해주세요.
        </p>
        `;

        return;
    }

    drawMonth(
        startDate.getFullYear(),
        startDate.getMonth(),
        area
    );

    const next =
        new Date(
            startDate.getFullYear(),
            startDate.getMonth()+1,
            1
        );

    drawMonth(
        next.getFullYear(),
        next.getMonth(),
        area
    );
}


function drawMonth(
    year,
    month,
    area
){

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "calendarTitle";

    title.textContent =
        `${year}년 ${month+1}월`;

    area.appendChild(title);


    const week =
        document.createElement(
            "div"
        );

    week.className = "week";


    [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
    ].forEach(
        (name,index)=>{

            const el =
                document.createElement(
                    "div"
                );

            el.textContent = name;

            if(index===0)
                el.style.color="#e85b5b";

            if(index===6)
                el.style.color="#4d78df";

            week.appendChild(el);
        }
    );


    area.appendChild(week);


    const calendar =
        document.createElement(
            "div"
        );

    calendar.className = "calendar";


    const first =
        new Date(
            year,
            month,
            1
        );


    const last =
        new Date(
            year,
            month+1,
            0
        );


    for(
        let i=0;
        i<first.getDay();
        i++
    ){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day outside";

        calendar.appendChild(empty);
    }


    for(
        let day=1;
        day<=last.getDate();
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );

        const key = dateKey(date);


        const el =
            document.createElement(
                "div"
            );

        el.className = "day";

        el.textContent = day;


        if(date.getDay()===0)
            el.classList.add("sunday");

        if(date.getDay()===6)
            el.classList.add("saturday");


        if(
            date < startDate ||
            date > endDate
        ){

            el.classList.add("outside");
        }


        if(
            key === dateKey(startDate)
        ){

            el.classList.add("start");
        }


        if(
            key === dateKey(endDate)
        ){

            el.classList.add("end");
        }


        if(
            selectedDays.has(key) &&
            key !== dateKey(startDate) &&
            key !== dateKey(endDate)
        ){

            el.classList.add("selected");
        }


        if(
            date >= startDate &&
            date <= endDate
        ){

            el.classList.add("clickable");


            el.onclick =
            function(){

                if(
                    selectedDays.has(key)
                ){

                    selectedDays.delete(key);

                }
                else{

                    selectedDays.add(key);

                }

                drawCalendars();

                updateSummary();

                saveAll();
            };
        }


        calendar.appendChild(el);
    }


    area.appendChild(calendar);
}



/* =========================
   요약
========================= */

function updateSummary(){

    const count =
        selectedDays.size;


    const checkValue =
        document.getElementById(
            "checkDate"
        ).value;


    let untilCount = 0;
    let futureCount = 0;


    if(checkValue){

        const check =
            parseDate(checkValue);


        selectedDays.forEach(
            key=>{

                const date =
                    parseDate(key);


                if(date <= check){

                    untilCount++;

                }
                else{

                    futureCount++;
                }
            }
        );

    }
    else{

        untilCount =
            selectedDays.size;
    }


    const earned =
        untilCount *
        POINT_PER_DAY;


    const futureMoney =
        futureCount *
        POINT_PER_DAY;


    document.getElementById(
        "workDays"
    ).textContent =
        count+"일";


    document.getElementById(
        "workedUntilCheck"
    ).textContent =
        untilCount+"일";


    document.getElementById(
        "earnedMoney"
    ).textContent =
        money(earned);


    document.getElementById(
        "futureMoney"
    ).textContent =
        money(futureMoney);


    drawCalendarsIfReady();
}


function drawCalendarsIfReady(){

    if(startDate){

        drawCalendars();
    }
}



/* =========================
   포인트 조회
========================= */

function calculateBalance(){

    if(!startDate){

        alert(
            "먼저 적립 시작일을 저장해주세요."
        );

        return;
    }


    const checkValue =
        document.getElementById(
            "checkDate"
        ).value;


    const balance =
        Number(
            document.getElementById(
                "balance"
            ).value
        );


    if(!checkValue){

        alert(
            "조회 기준일을 선택해주세요."
        );

        return;
    }


    if(
        isNaN(balance) ||
        balance < 0
    ){

        alert(
            "잔여 포인트를 입력해주세요."
        );

        return;
    }


    const check =
        parseDate(checkValue);


    if(check < startDate){

        alert(
            "조회 기준일은 적립 시작일 이후 날짜로 선택해주세요."
        );

        return;
    }


    /*
       근무 시작일도 반드시 조회 목록에 포함.
       단, selectedDays에 이미 들어있다면 중복하지 않음.
    */
    const workDayKeys =
        new Set([
            dateKey(startDate),
            ...selectedDays
        ]);


    const workDays =
        [...workDayKeys]
        .map(x=>parseDate(x))
        .filter(date=>date <= check)
        .sort((a,b)=>a-b);


    if(workDays.length===0){

        document.getElementById(
            "balanceResult"
        ).innerHTML =
        `
        <div class="result">

        <strong>
        조회일: ${dateKey(check)}
        </strong>

        조회 기준일까지 선택된 근무일이 없습니다.

        <br><br>

        현재 잔여 포인트:
        <b class="blue">
        ${money(balance)}
        </b>

        </div>
        `;

        return;
    }


    /*
       실제로 적립금이 생기는 날짜는
       근무일의 다음 날.
    */
    let remaining = balance;

    const data=[];


    /*
       최신 근무일부터 잔여 포인트를 역산.
       당일에는 아직 적립되지 않았으므로
       사용/잔여 계산 대상에서 제외.
    */
    const earnedLots =
        workDays
        .filter(workDate =>
            check > workDate
        );


    for(
        let i=earnedLots.length-1;
        i>=0;
        i--
    ){

        const workDate =
            earnedLots[i];

        const earnedDate =
            addDays(
                workDate,
                1
            );

        const expiry =
            addDays(
                workDate,
                EXPIRY_DAYS
            );


        let amount=0;


        if(
            check < expiry &&
            remaining > 0
        ){

            amount =
                Math.min(
                    POINT_PER_DAY,
                    remaining
                );

            remaining -= amount;
        }


        let status="";
        let className="";


        if(
            check >= expiry
        ){

            status="소멸됨";
            className="statusExpired";

        }
        else if(
            amount > 0
        ){

            status="현재 남아있음";
            className="statusAlive";

        }
        else{

            status="사용된 것으로 추정";
        }


        data.push({

            workDate,
            earnedDate,
            expiry,
            amount,
            status,
            className

        });
    }


    /*
       아직 적립되지 않은 근무일도
       조회 결과에 표시하기 위해 추가.
    */
    workDays.forEach(
        workDate=>{

            const already =
                data.some(
                    item =>
                        dateKey(item.workDate) ===
                        dateKey(workDate)
                );


            if(!already){

                data.push({

                    workDate,
                    earnedDate:
                        addDays(
                            workDate,
                            1
                        ),
                    expiry:
                        addDays(
                            workDate,
                            EXPIRY_DAYS
                        ),
                    amount:0,
                    status:"다음 날 적립",
                    className:"statusFuture"

                });
            }
        }
    );


    data.sort(
        (a,b)=>
            a.workDate-b.workDate
    );


    const futureLots =
        [...selectedDays]
        .map(x=>parseDate(x))
        .filter(date=>date > check)
        .sort((a,b)=>a-b);


    let html =
    `
    <div class="result">

    <strong>
    조회일: ${dateKey(check)}
    </strong>

    현재 잔여 포인트:
    <b class="blue">
    ${money(balance)}
    </b>

    </div>

    <div class="result">

    <strong>
    근무일별 적립금 상태
    </strong>

    <span class="small">
    근무일 다음 날 적립되며,
    소멸일은 근무일로부터 31일 뒤입니다.
    </span>

    </div>
    `;


    data.forEach(
        item=>{

            let extra="";


            if(
                item.amount > 0 &&
                check < item.expiry
            ){

                const daysLeft =
                    Math.ceil(
                        (
                            item.expiry -
                            check
                        ) /
                        (
                            1000*
                            60*
                            60*
                            24
                        )
                    );


                extra =
                `
                <br>
                소멸까지 약
                ${daysLeft}일
                `;
            }


            html +=
            `
            <div class="lot">

            <b>
            ${dateKey(item.workDate)}
            근무
            </b>

            <br>

            적립일:
            ${dateKey(item.earnedDate)}

            <br>

            적립금:
            ${
                check <= item.workDate
                ?
                money(0)
                :
                money(POINT_PER_DAY)
            }

            <br>

            소멸 예정:
            ${dateKey(item.expiry)}

            <br>

            상태:
            <span class="${item.className}">
            ${item.status}
            </span>

            ${
                item.amount > 0
                ?
                `
                <br>
                현재 남아있는 금액:
                <b>
                ${money(item.amount)}
                </b>
                `
                :
                ""
            }

            ${extra}

            </div>
            `;
        }
    );


    if(futureLots.length > 0){

        html +=
        `
        <div class="result">

        <strong>
        조회 기준일 이후 예정 적립금
        </strong>

        ${futureLots.length}일 /
        ${money(
            futureLots.length *
            POINT_PER_DAY
        )}

        <br>

        <span class="small">
        미리 선택해둔 미래 근무일이므로
        현재 잔여 포인트 계산에는 포함하지 않았습니다.
        </span>

        </div>
        `;
    }


    if(remaining > 0){

        html +=
        `
        <div class="result">

        <strong>
        계산되지 않은 잔여금
        </strong>

        ${money(remaining)}

        <br>

        <span class="small">
        선택한 근무일보다 오래된 적립금이 있거나
        실제 사용 내역과 달라서 역산되지 않은
        금액일 수 있습니다.
        </span>

        </div>
        `;
    }


    document.getElementById(
        "balanceResult"
    ).innerHTML = html;
}



/* =========================
   메모 저장
========================= */

function saveMemo(){

    const textarea =
        document.getElementById(
            "memo"
        );


    const text =
        textarea.value.trim();


    if(!text){

        alert(
            "메모 내용을 입력해주세요."
        );

        return;
    }


    const now = new Date();


    const record={

        id:Date.now(),

        date:
            formatDateTime(now),

        text:text
    };


    memoList.unshift(record);

    textarea.value="";

    renderMemos();

    saveAll();


    document.getElementById(
        "memoSaved"
    ).textContent =
        "메모가 저장됐어요.";
}


function formatDateTime(date){

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const d =
        String(
            date.getDate()
        ).padStart(2,"0");

    const h =
        String(
            date.getHours()
        ).padStart(2,"0");

    const min =
        String(
            date.getMinutes()
        ).padStart(2,"0");


    return `${y}.${m}.${d} ${h}:${min}`;
}



/* =========================
   메모 표시
========================= */

function renderMemos(){

    const area =
        document.getElementById(
            "memoList"
        );


    area.innerHTML="";


    if(
        memoList.length === 0
    ){

        area.innerHTML =
        `
        <div class="memoEmpty">
        아직 저장된 메모가 없습니다.
        </div>
        `;

        return;
    }


    memoList.forEach(
        memo=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className="memoItem";


            const date =
                document.createElement(
                    "div"
                );

            date.className="memoDate";

            date.textContent =
                memo.date;


            const text =
                document.createElement(
                    "div"
                );

            text.className="memoText";

            text.textContent =
                memo.text;


            const del =
                document.createElement(
                    "button"
                );

            del.className="memoDelete";

            del.textContent =
                "이 메모 삭제";


            del.onclick =
            function(){

                deleteMemo(memo.id);
            };


            item.appendChild(date);
            item.appendChild(text);
            item.appendChild(del);

            area.appendChild(item);
        }
    );
}


function deleteMemo(id){

    memoList =
        memoList.filter(
            memo =>
                memo.id !== id
        );


    renderMemos();

    saveAll();
}



/* =========================
   메모 전체 삭제
========================= */

function clearMemos(){

    if(
        memoList.length === 0
    ){

        alert(
            "삭제할 메모가 없습니다."
        );

        return;
    }


    const ok =
        confirm(
            "저장된 메모를 전부 삭제할까요?"
        );


    if(!ok)return;


    memoList=[];

    renderMemos();

    saveAll();


    document.getElementById(
        "memoSaved"
    ).textContent =
        "메모 기록을 모두 삭제했어요.";
}



/* =========================
   저장
========================= */

function saveAll(){

    const data={

        startDate:
            startDate
            ?
            dateKey(startDate)
            :
            null,

        selectedDays:
            Array.from(
                selectedDays
            ),

        balance:
            document.getElementById(
                "balance"
            ).value,

        checkDate:
            document.getElementById(
                "checkDate"
            ).value,

        memoList:
            memoList
    };


    try{

        localStorage.setItem(
            "pointManagerData",
            JSON.stringify(data)
        );

    }
    catch(e){}
}



/* =========================
   불러오기
========================= */

function loadAll(){

    let raw=null;


    try{

        raw =
            localStorage.getItem(
                "pointManagerData"
            );

    }
    catch(e){

        raw=null;
    }


    if(raw){

        try{

            const data =
                JSON.parse(raw);


            if(data.startDate){

                startDate =
                    parseDate(
                        data.startDate
                    );


                endDate =
                    addDays(
                        startDate,
                        EXPIRY_DAYS
                    );


                document.getElementById(
                    "startDate"
                ).value =
                    data.startDate;


                document.getElementById(
                    "endDate"
                ).textContent =
                    dateKey(endDate);
            }


            selectedDays =
                new Set(
                    data.selectedDays || []
                );


            document.getElementById(
                "balance"
            ).value =
                data.balance || "";


            document.getElementById(
                "checkDate"
            ).value =
                data.checkDate || "";


            memoList =
                Array.isArray(
                    data.memoList
                )
                ?
                data.memoList
                :
                [];

        }
        catch(e){

            memoList=[];
        }
    }


    drawCalendars();

    updateSummary();

    renderMemos();
}



/* =========================
   초기화
========================= */

function resetAll(){

    const ok =
        confirm(
            "적립금, 근무일, 포인트 조회, 메모를 모두 초기화할까요?"
        );


    if(!ok){

        return;
    }


    memoList=[];

    startDate=null;

    endDate=null;

    selectedDays =
        new Set();


    document.getElementById(
        "startDate"
    ).value="";


    document.getElementById(
        "endDate"
    ).textContent="-";


    document.getElementById(
        "checkDate"
    ).value="";


    document.getElementById(
        "balance"
    ).value="";


    document.getElementById(
        "memo"
    ).value="";


    document.getElementById(
        "balanceResult"
    ).innerHTML="";


    document.getElementById(
        "memoSaved"
    ).textContent =
        "전체 데이터를 초기화했어요.";


    try{

        localStorage.removeItem(
            "pointManagerData"
        );

    }
    catch(e){}


    drawCalendars();

    updateSummary();

    renderMemos();
}



/* =========================
   실행
========================= */

loadAll();

</script>
</body>
</html>
