<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>적립금 관리</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f5f8;
    color:#222;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:18px 14px 40px;
}

h1{
    font-size:25px;
    margin:5px 0 20px;
    text-align:center;
}

h2{
    font-size:19px;
    margin:0 0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

/* ✅ 공통 폼 요소 스타일 통합 */
input,
textarea,
button{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;

    font-family:inherit;
    font-size:16px;

    border:0;
    border-radius:12px;

    outline:none;
}

/* ✅ input / textarea 공통 배경 */
input,
textarea{
    background:#f1f2f5;
    padding:13px;
}

/* ✅ date input만 높이 보정 */
input[type="date"]{
    height:46px;
    padding:10px 12px;
}

/* textarea만 별도 */
textarea{
    min-height:110px;
    resize:none;
}

/* button만 스타일 분리 */
button{
    padding:13px 15px;
    font-weight:600;
    cursor:pointer;
}

/* 버튼 타입 */
.primary{
    width:100%;
    background:#5278ff;
    color:white;
    margin-top:10px;
}

.secondary{
    background:#eef0f5;
    color:#333;
}

.danger{
    background:#ffe9e9;
    color:#d33;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.summaryBox{
    background:#f5f6fa;
    border-radius:13px;
    padding:13px;
}

.summaryBox .title{
    font-size:12px;
    color:#777;
    margin-bottom:5px;
}

.summaryBox .value{
    font-size:18px;
    font-weight:700;
}

.blue{ color:#5278ff; }
.red{ color:#e45757; }
.green{ color:#00a878; }

.calendarTitle{
    font-size:18px;
    font-weight:700;
    margin:17px 0 10px;
}

.week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:4px;
}

.week div{
    text-align:center;
    font-size:12px;
    color:#888;
    padding:5px 0;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
}

.day{
    min-width:0;
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    position:relative;
}

.day.clickable{ cursor:pointer; }
.day.sunday{ color:#e85b5b; }
.day.saturday{ color:#4d78df; }

.day.selected{
    background:#5278ff;
    color:white !important;
    font-weight:700;
}

.day.start{
    background:#00ae83;
    color:white !important;
    font-weight:700;
}

.day.end{
    background:#ed6b6b;
    color:white !important;
    font-weight:700;
}

.day.outside{ opacity:.25; }

.day.futureSelected{
    background:#9aaeff;
    color:white !important;
    font-weight:700;
}

.small{
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.result{
    border-radius:12px;
    background:#f6f7fa;
    padding:13px;
    margin-top:9px;
}

.result strong{
    display:block;
    margin-bottom:5px;
}

.lot{
    border:1px solid #e7e8ec;
    border-radius:12px;
    padding:12px;
    margin-top:8px;
    font-size:14px;
    line-height:1.7;
}

.statusAlive{ color:#00a878; font-weight:700; }
.statusExpired{ color:#e45757; font-weight:700; }
.statusFuture{ color:#5278ff; font-weight:700; }

.memoItem{
    background:#f6f7fa;
    border-radius:13px;
    padding:13px;
    margin-top:9px;
}

.memoDate{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

.memoText{
    white-space:pre-wrap;
    font-size:14px;
    line-height:1.6;
    padding-right:5px;
}

.memoDelete{
    margin-top:10px;
    padding:8px 11px;
    font-size:12px;
    background:#ffe9e9;
    color:#d33;
}

.memoEmpty{
    text-align:center;
    padding:18px 5px;
    color:#999;
    font-size:13px;
}

.noteSaved{
    color:#00a878;
    font-size:12px;
    margin-top:7px;
    min-height:17px;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:17px 0;
}

</style>
</head>

<body>

<!-- 기존 HTML/JS 그대로 유지 -->

</body>
</html>
